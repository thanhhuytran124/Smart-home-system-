<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="pArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <!-- Gradient removed -->
  </defs>

  <text x="500" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#222">Firmware Deployment with Pymakr</text>

  <!-- 1. VS Code -->
  <rect x="40" y="100" width="180" height="120" rx="12" fill="#0069BE"/>
  <text x="130" y="135" font-size="15" font-weight="700" text-anchor="middle" fill="white">VS Code</text>
  <text x="130" y="160" font-size="12" text-anchor="middle" fill="white">+ Pymakr</text>
  <text x="130" y="178" font-size="11" text-anchor="middle" fill="#cfe2ff">extension</text>
  <text x="130" y="205" font-size="11" text-anchor="middle" fill="white">editor &amp; project view</text>

  <!-- 2. esp32/ source files -->
  <rect x="280" y="80" width="200" height="160" rx="12" fill="#fff" stroke="#0078d4" stroke-width="2"/>
  <text x="380" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#0078d4">esp32/ source</text>
  <text x="295" y="135" font-size="11" font-family="Consolas, monospace" fill="#333">main.py</text>
  <text x="295" y="153" font-size="11" font-family="Consolas, monospace" fill="#333">boot.py</text>
  <text x="295" y="171" font-size="11" font-family="Consolas, monospace" fill="#333">config.py</text>
  <text x="295" y="189" font-size="11" font-family="Consolas, monospace" fill="#333">network_module.py</text>
  <text x="295" y="207" font-size="11" font-family="Consolas, monospace" fill="#333">coreiot_module.py</text>
  <text x="295" y="225" font-size="11" font-family="Consolas, monospace" fill="#333">mqtt.py · fan_module.py · ...</text>

  <!-- 3. Pymakr action -->
  <rect x="540" y="100" width="180" height="120" rx="12" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="630" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="#856404">Pymakr</text>
  <text x="630" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#856404">"Upload" / Sync</text>
  <text x="630" y="180" font-size="11" text-anchor="middle" fill="#666">Reads pymakr.conf</text>
  <text x="630" y="195" font-size="11" text-anchor="middle" fill="#666">Pushes files via</text>
  <text x="630" y="210" font-size="11" text-anchor="middle" fill="#666">serial REPL</text>

  <!-- 4. Serial -->
  <rect x="780" y="100" width="180" height="120" rx="12" fill="#d4edda" stroke="#155724" stroke-width="2"/>
  <text x="870" y="135" font-size="14" font-weight="700" text-anchor="middle" fill="#155724">YoloBit</text>
  <text x="870" y="155" font-size="12" text-anchor="middle" fill="#155724">(ESP32)</text>
  <text x="870" y="180" font-size="11" text-anchor="middle" fill="#155724">Files written to</text>
  <text x="870" y="195" font-size="11" text-anchor="middle" fill="#155724">internal flash</text>
  <text x="870" y="210" font-size="11" text-anchor="middle" fill="#155724">Reset → run main.py</text>

  <!-- arrows -->
  <line x1="220" y1="160" x2="280" y2="160" stroke="#444" stroke-width="2.5" marker-end="url(#pArr)"/>
  <text x="250" y="148" font-size="10" text-anchor="middle" fill="#444">edit</text>

  <line x1="480" y1="160" x2="540" y2="160" stroke="#444" stroke-width="2.5" marker-end="url(#pArr)"/>
  <text x="510" y="148" font-size="10" text-anchor="middle" fill="#444">select</text>

  <line x1="720" y1="160" x2="780" y2="160" stroke="#444" stroke-width="2.5" marker-end="url(#pArr)"/>
  <text x="750" y="148" font-size="10" text-anchor="middle" fill="#444">USB serial</text>

  <!-- Console at bottom -->
  <rect x="40" y="265" width="920" height="80" rx="10" fill="#1e1e1e"/>
  <text x="60" y="288" font-size="12" font-family="Consolas, monospace" fill="#0f0">$ Pymakr &gt; Upload project to device</text>
  <text x="60" y="306" font-size="12" font-family="Consolas, monospace" fill="#0af">[INFO] Connected to /dev/ttyUSB0 (115200 baud)</text>
  <text x="60" y="324" font-size="12" font-family="Consolas, monospace" fill="#0f0">[OK] main.py · boot.py · config.py · mqtt.py · fan_module.py · rgb_module.py · network_module.py · coreiot_module.py</text>
</svg>
