<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
  </defs>

  <text x="550" y="35" font-size="22" font-weight="700" text-anchor="middle" fill="#222">Bidirectional Data Flow — Uplink &amp; Downlink</text>

  <!-- =========================================================== -->
  <!-- UPLINK: Sensor → Cloud → Dashboard                          -->
  <!-- =========================================================== -->
  <rect x="20" y="70" width="1060" height="240" rx="14" fill="#E3F2FD"/>
  <text x="40" y="98" font-size="15" font-weight="700" fill="#1976d2">UPLINK — Sensor data flow (every 5 seconds)</text>

  <!-- Sensors -->
  <rect x="40" y="130" width="150" height="80" rx="10" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="115" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#222">DHT20</text>
  <text x="115" y="180" font-size="11" text-anchor="middle" fill="#666">+ Light Sensor</text>
  <text x="115" y="197" font-size="11" text-anchor="middle" fill="#666">I²C &amp; ADC</text>

  <!-- main.py -->
  <rect x="230" y="130" width="170" height="80" rx="10" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="315" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#222">main.py</text>
  <text x="315" y="178" font-size="11" text-anchor="middle" fill="#666">Read sensors @ 0.1s</text>
  <text x="315" y="195" font-size="11" text-anchor="middle" fill="#666">LCD render</text>

  <!-- publish_sensor_data -->
  <rect x="440" y="130" width="180" height="80" rx="10" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="530" y="158" font-size="13" font-weight="700" text-anchor="middle" fill="#222">coreiot_module</text>
  <text x="530" y="178" font-size="11" text-anchor="middle" fill="#666">publish_sensor_data()</text>
  <text x="530" y="195" font-size="11" text-anchor="middle" fill="#666">→ mqtt.publish()</text>

  <!-- Adafruit IO -->
  <rect x="660" y="130" width="170" height="80" rx="10" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="745" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Adafruit IO</text>
  <text x="745" y="178" font-size="11" text-anchor="middle" fill="#666">MQTT broker stores</text>
  <text x="745" y="195" font-size="11" text-anchor="middle" fill="#666">+ exposes REST API</text>

  <!-- Dashboard -->
  <rect x="870" y="130" width="195" height="80" rx="10" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="967" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Web Dashboard</text>
  <text x="967" y="178" font-size="11" text-anchor="middle" fill="#666">pollAdafruit() @ 5s</text>
  <text x="967" y="195" font-size="11" text-anchor="middle" fill="#666">→ JustGage.refresh()</text>

  <!-- Arrows -->
  <line x1="190" y1="170" x2="230" y2="170" stroke="#1976d2" stroke-width="2.5" marker-end="url(#arrUp)"/>
  <line x1="400" y1="170" x2="440" y2="170" stroke="#1976d2" stroke-width="2.5" marker-end="url(#arrUp)"/>
  <line x1="620" y1="170" x2="660" y2="170" stroke="#1976d2" stroke-width="2.5" marker-end="url(#arrUp)"/>
  <line x1="830" y1="170" x2="870" y2="170" stroke="#1976d2" stroke-width="2.5" marker-end="url(#arrUp)"/>

  <text x="210" y="160" font-size="10" text-anchor="middle" fill="#1976d2">read</text>
  <text x="420" y="160" font-size="10" text-anchor="middle" fill="#1976d2">call</text>
  <text x="640" y="160" font-size="10" text-anchor="middle" fill="#1976d2">MQTT pub</text>
  <text x="850" y="160" font-size="10" text-anchor="middle" fill="#1976d2">HTTPS GET</text>

  <!-- Sample payload -->
  <rect x="40" y="235" width="1020" height="55" rx="8" fill="#fff" stroke="#90CAF9" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="60" y="258" font-size="12" font-weight="600" fill="#1976d2">Sample MQTT payload:</text>
  <text x="60" y="278" font-size="12" font-family="Consolas, monospace" fill="#333">TOPIC=&lt;user&gt;/feeds/temperature  ·  VALUE="28.4"   |   TOPIC=&lt;user&gt;/feeds/humidity  ·  VALUE="65"   |   TOPIC=&lt;user&gt;/feeds/light  ·  VALUE="78"</text>

  <!-- =========================================================== -->
  <!-- DOWNLINK: User → Cloud → Device                             -->
  <!-- =========================================================== -->
  <rect x="20" y="335" width="1060" height="265" rx="14" fill="#FFEBEE"/>
  <text x="40" y="363" font-size="15" font-weight="700" fill="#d32f2f">DOWNLINK — User control commands (real-time)</text>

  <rect x="40" y="395" width="180" height="80" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="130" y="423" font-size="14" font-weight="700" text-anchor="middle" fill="#222">User Action</text>
  <text x="130" y="443" font-size="11" text-anchor="middle" fill="#666">Drag fan slider</text>
  <text x="130" y="460" font-size="11" text-anchor="middle" fill="#666">Pick LED color</text>

  <rect x="260" y="395" width="170" height="80" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="345" y="423" font-size="13" font-weight="700" text-anchor="middle" fill="#222">script.js</text>
  <text x="345" y="443" font-size="11" text-anchor="middle" fill="#666">sendFanSpeed()</text>
  <text x="345" y="460" font-size="11" text-anchor="middle" fill="#666">applyLEDColor()</text>

  <rect x="470" y="395" width="170" height="80" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="555" y="423" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Adafruit IO</text>
  <text x="555" y="443" font-size="11" text-anchor="middle" fill="#666">POST /feeds/.../data</text>
  <text x="555" y="460" font-size="11" text-anchor="middle" fill="#666">→ MQTT push</text>

  <rect x="680" y="395" width="180" height="80" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="770" y="423" font-size="13" font-weight="700" text-anchor="middle" fill="#222">main.py loop</text>
  <text x="770" y="443" font-size="11" text-anchor="middle" fill="#666">mqtt.check_msg()</text>
  <text x="770" y="460" font-size="11" text-anchor="middle" fill="#666">→ dispatch callback</text>

  <rect x="900" y="395" width="165" height="80" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="983" y="423" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Actuator</text>
  <text x="983" y="443" font-size="11" text-anchor="middle" fill="#666">fan_callback / </text>
  <text x="983" y="460" font-size="11" text-anchor="middle" fill="#666">led_callback</text>

  <line x1="220" y1="435" x2="260" y2="435" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrDown)"/>
  <line x1="430" y1="435" x2="470" y2="435" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrDown)"/>
  <line x1="640" y1="435" x2="680" y2="435" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrDown)"/>
  <line x1="860" y1="435" x2="900" y2="435" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrDown)"/>

  <text x="240" y="425" font-size="10" text-anchor="middle" fill="#d32f2f">event</text>
  <text x="450" y="425" font-size="10" text-anchor="middle" fill="#d32f2f">HTTPS POST</text>
  <text x="660" y="425" font-size="10" text-anchor="middle" fill="#d32f2f">MQTT push</text>
  <text x="880" y="425" font-size="10" text-anchor="middle" fill="#d32f2f">callback</text>

  <!-- Sample payload -->
  <rect x="40" y="500" width="1020" height="80" rx="8" fill="#fff" stroke="#EF9A9A" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="60" y="523" font-size="12" font-weight="600" fill="#d32f2f">Sample command payloads:</text>
  <text x="60" y="545" font-size="12" font-family="Consolas, monospace" fill="#333">Fan:        POST &lt;user&gt;/feeds/fan-speed/data       body={"value": 75}     →  PWM duty = 75 × 10.23 = 767</text>
  <text x="60" y="565" font-size="12" font-family="Consolas, monospace" fill="#333">RGB LED:    POST &lt;user&gt;/feeds/led-rgb/data         body={"value":"#00FF00"}  →  pixels[0..3] = (0,255,0)</text>
</svg>
